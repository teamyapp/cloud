apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  namespace: staging
  name: cloud
spec:
  itemPath: vaults/Automation/items/apps:staging:cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: staging
  name: cloud
  labels:
    app: cloud
  annotations:
    # force policy will ensure that deployment is updated
    # even when tag is unchanged (latest remains)
    keel.sh/policy: force
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloud
  template:
    metadata:
      labels:
        app: cloud
    spec:
      containers:
        - name: cloud
          image: registry.digitalocean.com/teamyapp/cloud-staging:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 8081
            - containerPort: 10000
          env:
            - name: ENVIRONMENT
              value: staging
            - name: WEB_API_BASE_URL
              value: https://cloud.staging.teamyapp.com
            - name: SERVICE_RUNNER_WEB_SERVER_PORT
              value: "8080"
            - name: SERVICE_RUNNER_GRPC_SERVER_PORT
              value: "8081"
            - name: SERVICE_RUNNER_MONITORING_SERVER_PORT
              value: "10000"
            - name: SERVICE_RUNNER_ENABLE_TRACING
              value: "true"
            - name: SERVICE_RUNNER_TRACE_COLLECTOR_ENDPOINT
              value: "tempo.monitoring:4317"
            - name: SERVICE_RUNNER_IDENTITY_API_ENDPOINT
              value: "http://localhost:8080/identity"
            - name: DB_HOST
              value: postgres.db.svc.cluster.local
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: db-name
            - name: DB_MAX_OPEN_CONNECTIONS
              value: "150"
            - name: DB_MAX_IDLE_CONNECTIONS
              value: "15"
            - name: DB_CONNECTION_MAX_LIFE_TIME
              value: "30m"
            - name: DB_CONNECTION_MAX_IDLE_TIME
              value: "30m"
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: jwt-signing-key
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: google-client-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: github-client-secret
            - name: SLACK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: slack-client-id
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: slack-client-secret
            - name: ACCESS_TOKEN_TTL
              value: 168h
            - name: GEN_RANGE_SIZE
              value: "100"
            - name: S3_ENDPOINT
              value: sfo3.digitaloceanspaces.com
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: s3-access-key-id
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloud
                  key: s3-access-key
            - name: S3_BUCKET_NAME
              value: teamyapp
---
apiVersion: v1
kind: Service
metadata:
  namespace: staging
  name: cloud
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '10000'
spec:
  selector:
    app: cloud
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: grpc
      port: 81
      targetPort: 8081
    - name: monitoring
      port: 10000
      targetPort: 10000
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  namespace: staging
  name: cloud
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cloud.staging.teamyapp.com`)
      services:
        - kind: Service
          namespace: staging
          name: cloud
          port: 80
          passHostHeader: true
    - kind: Rule
      match: Host(`rpc-cloud.staging.teamyapp.com`)
      services:
        - kind: Service
          namespace: staging
          name: cloud
          port: 81
          passHostHeader: true
          scheme: h2c
  tls:
    secretName: cert-teamyapp.com
