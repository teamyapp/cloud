kind: pipeline
type: kubernetes
name: testing

steps:
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
  - name: build & publish Docker image
    image: plugins/docker
    settings:
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      repo: registry.digitalocean.com/teamyapp/cloud-testing
      registry: registry.digitalocean.com
      target: production
      cache_from: registry.digitalocean.com/teamyapp/cloud-testing
  - name: notify image update
    image: plugins/webhook
    settings:
      urls: http://keel.keel.svc.cluster.local:9300/v1/webhooks/native
      template: |
        {
          "name": "registry.digitalocean.com/teamyapp/cloud-testing",
          "tag": "latest"
        }
trigger:
  branch:
    - testing
  event:
    - push
---
kind: pipeline
type: kubernetes
name: feature

steps:
  - name: slack
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK
      channel: code
    when:
      status: [ success, failure ]
  - name: Run unit tests
    image: golang:1.18
    commands:
      - go test ./...
trigger:
  branch:
    - master
    - main
  event:
    - pull_request
